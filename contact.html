<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FlowerAcademy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f9f7ff; transition: 0.3s; }
        body.dark { background-color: #0b0b0d !important; color: white; }

        .contact-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 25px; /* حواف ناعمة جداً */
            box-shadow: 0 10px 30px rgba(160, 116, 250, 0.1);
            text-align: center;
        }
        body.dark .contact-container { background-color: #242526 !important; box-shadow: none; }

        .contact-header h2 { color: #a074fa; margin-bottom: 10px; }
        .contact-header p { color: #666; margin-bottom: 30px; }
        body.dark .contact-header p { color: #b0b3b8; }

        /* نظام تقييم الورود */
        .flower-rating {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-direction: row-reverse; /* لضبط التحديد من اليسار لليمين */
        }
        .flower-rating input { display: none; }
        .flower-rating label {
            font-size: 40px;
            cursor: pointer;
            transition: 0.3s;
            filter: grayscale(100%); /* وردة رمادية قبل التحديد */
        }
        .flower-rating label:hover,
        .flower-rating label:hover ~ label,
        .flower-rating input:checked ~ label {
            filter: grayscale(0%); /* تلوين الوردة عند الوقوف عليها أو تحديدها */
            transform: scale(1.2);
        }

        /* بوكس الرأي */
        .feedback-box { width: 100%; margin-top: 20px; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 18px;
            border: 2px solid #f3e8ff;
            background: #fdfbff;
            font-family: inherit;
            resize: none;
            transition: 0.3s;
        }
        body.dark textarea { background: #3a3b3c; border-color: #444; color: white; }
        textarea:focus { border-color: #a074fa; outline: none; }

        .btn-submit {
            background: #a074fa;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #ea74ff; transform: translateY(-3px); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">FlowerAcademy</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="right-nav">
            <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <div class="contact-container">
        <div class="contact-header">
            <h2>How was your experience? 🌸</h2>
            <p>Your feedback helps our academy bloom and grow!</p>
        </div>

        <form id="contactForm">
            <div class="flower-rating">
                <input type="radio" name="rating" id="flow5" value="5"><label for="flow5">🌸</label>
                <input type="radio" name="rating" id="flow4" value="4"><label for="flow4">🌸</label>
                <input type="radio" name="rating" id="flow3" value="3"><label for="flow3">🌸</label>
                <input type="radio" name="rating" id="flow2" value="2"><label for="flow2">🌸</label>
                <input type="radio" name="rating" id="flow1" value="1"><label for="flow1">🌸</label>
            </div>

            <div class="feedback-box">
                <textarea id="userFeedback" placeholder="Write your thoughts here..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Feedback</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script src="contact.js"></script>
</body>
</html>
