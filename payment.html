<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | FlowerAcademy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); font-family: sans-serif; }
        .payment-header { text-align: center; margin-bottom: 30px; }
        .order-info { background: #fdfaff; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed #a074fa; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box; }
        .input-group input:focus { border-color: #a074fa; box-shadow: 0 0 5px rgba(160, 116, 250, 0.3); }

        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .pay-btn { width: 100%; background: #a074fa; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .pay-btn:hover { background: #8a59f7; transform: translateY(-2px); }
        
        body.dark { background-color: #1a1a2e; }
        body.dark .payment-container { background: #2a2a40; color: white; }
        body.dark .input-group label { color: #ccc; }
        body.dark .input-group input { background: #3a3a55; border-color: #444; color: white; }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="payment-header">
        <h2 style="color: #a074fa;">Secure Checkout 🔒</h2>
        <p>Complete your enrollment to start blooming</p>
    </div>

    <div class="order-info">
        <p><strong>Course:</strong> <span id="payCourseTitle">Loading...</span></p>
        <p><strong>Total to Pay:</strong> <span id="payCoursePrice" style="color:#ea74ff; font-weight:bold;">0 EGP</span></p>
    </div>

    <form id="paymentForm">
        <div class="input-group">
            <label>Cardholder Name</label>
            <input type="text" id="cardName" placeholder="Full Name" required>
        </div>

        <div class="input-group">
            <label>Card Number</label>
            <!-- تحديد 16 رقم فقط -->
            <input type="text" id="cardNumber" placeholder="1234 5678 1234 5678" maxlength="19" required>
        </div>

        <div class="card-row">
            <div class="input-group">
                <label>Expiry Date</label>
                <!-- تحديد نظام MM/YY -->
                <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
            </div>
            <div class="input-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123" maxlength="3" required>
            </div>
        </div>

        <button type="submit" class="pay-btn">Pay Now & Unlock Course</button>
    </form>
</div>

<script src="courses.js"></script>
<script>
    // 1. سحب بيانات الكورس
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = parseInt(urlParams.get('id'));
    const currentCourse = courses.find(c => c.id === courseId);

    if(currentCourse) {
        document.getElementById("payCourseTitle").innerText = currentCourse.title;
        document.getElementById("payCoursePrice").innerText = currentCourse.price + " EGP";
    }

    // 2. تنسيق رقم الكارت (يضيف مسافة كل 4 أرقام)
    document.getElementById('cardNumber').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    // 3. تنسيق التاريخ (يضيف / بعد أول رقمين)
    document.getElementById('expiryDate').addEventListener('input', function (e) {
        let input = e.target.value.replace(/[^\d]/g, '');
        if (input.length > 2) {
            input = input.substring(0, 2) + '/' + input.substring(2, 4);
        }
        e.target.value = input;
    });

    // 4. معالجة عملية الدفع
    document.getElementById('paymentForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.querySelector('.pay-btn');
        btn.innerText = "Processing... ⏳";
        btn.disabled = true;

        setTimeout(() => {
            alert("Payment Successful! 🎉\nYour course content is now unlocked.");
            // التوجه لصفحة عرض الكورس بعد النجاح
            window.location.href = "view-course.html?id=" + courseId;
        }, 2500);
    };
</script>

</body>
</html>
